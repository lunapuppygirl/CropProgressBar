[mod]
id = "cropprogressbar"
name = "Crop Progress Bar"
group = "dev.lunapuppygirl"
version = "1.3.0"
channel_tag = ""
description = "Minecraft mod that adds progress bar above crops"
authors = ["lunathepuppygirl"]
contributors = []
inception_year = "2026"
license.name = "MIT"
license.url = "https://opensource.org/licenses/MIT"
license.dist = "repo"
sources_url = "https://git.lunapuppygirl.dev/Luna/CropProgressBar"
homepage_url = "https://modrinth.com/project/lzb03jkV"
issues_url = "https://git.lunapuppygirl.dev/Luna/CropProgressBar/issues"
discord_url = ""
environment = "client_only"
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]
dev_jvm_args_mixin_debug = [
	"-Dmixin.env.remapRefMap=true",
	"-Dmixin.debug.verbose=true",
	"-Dmixin.debug.verify=true",
	"-Dmixin.debug.countInjections=true",
	"-Dmixin.debug=true",
	"-Dmixin.debug.export=true"
]
[[mod.pom.developers]]
id = "lunathepuppygirl"
name = "lunathepuppygirl"
url = "https://github.com/ghost"

